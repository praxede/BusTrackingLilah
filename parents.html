<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento do Ônibus Escolar - Unidade A</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1e88e5;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .logo {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    h1 {
      font-size: 1.4em;
      margin: 0;
    }

    #map {
      height: calc(100vh - 80px);
      width: 100%;
    }

    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 0.95em;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <img src="LogoPrisma.png" alt="Logo Prisma" class="logo">
    <h1>Localização do Ônibus Escolar - Unidade A</h1>
  </header>

  <div id="map"></div>
  <div id="info">Aguardando dados do ônibus...</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    // Firebase config BusTrackingLilah (Unidade A)
    const firebaseConfig = {
      apiKey: "AIzaSyAO-Ln_NLKEQlwRb70SomMhHDrc5X-r7BI",
      authDomain: "bustrackinglilah.firebaseapp.com",
      databaseURL: "https://bustrackinglilah-default-rtdb.firebaseio.com",
      projectId: "bustrackinglilah",
      storageBucket: "bustrackinglilah.firebasestorage.app",
      messagingSenderId: "108193062408",
      appId: "1:108193062408:web:acb8ffc28d1c811572bbbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Inicializa mapa
    const map = L.map('map').setView([-23.55, -46.63], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Ícone de alfinete
    const busIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
      iconSize: [40, 40],
      iconAnchor: [20, 40]
    });

    let busMarker = null;
    const infoEl = document.getElementById('info');

    // Firebase reference para Unidade A
    const busRef = ref(db, 'onibus/unidadeA/localizacao');

    // Atualização em tempo real
    onValue(busRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.latitude != null && data.longitude != null) {
        const lat = data.latitude;
        const lng = data.longitude;
        const updated = data.atualizadoEm;

        if (!busMarker) {
          busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
          map.setView([lat, lng], 15);
        } else {
          busMarker.setLatLng([lat, lng]);
        }

        map.flyTo([lat, lng], 15, { animate: true });
        infoEl.textContent = `📍 Última atualização: ${updated}`;
      } else {
        infoEl.textContent = "Sem dados de localização no momento.";
      }
    }, (error) => {
      console.error("Erro ao ler Firebase:", error);
      infoEl.textContent = "Erro ao obter dados do ônibus.";
    });
  </script>
</body>
</html>
