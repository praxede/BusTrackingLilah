<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envio de Localização - Ônibus Unidade A</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }

    h1 {
      color: #1e88e5;
      text-align: center;
    }

    #status {
      margin-top: 20px;
      font-size: 1.1em;
      color: #333;
      padding: 10px 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Envio Automático da Localização - Unidade A</h1>
  <div id="status">Aguardando GPS...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    // Config Firebase da Unidade A (BusTrackingLilah)
    const firebaseConfig = {
      apiKey: "AIzaSyAO-Ln_NLKEQlwRb70SomMhHDrc5X-r7BI",
      authDomain: "bustrackinglilah.firebaseapp.com",
      databaseURL: "https://bustrackinglilah-default-rtdb.firebaseio.com",
      projectId: "bustrackinglilah",
      storageBucket: "bustrackinglilah.firebasestorage.app",
      messagingSenderId: "108193062408",
      appId: "1:108193062408:web:acb8ffc28d1c811572bbbd"
    };

    // Inicializa Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusEl = document.getElementById("status");

    // Caminho fixo para Unidade A
    const path = `onibus/unidadeA/localizacao`;

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const timestamp = new Date().toLocaleString();

          // Envia para Firebase
          set(ref(db, path), {
            latitude: lat,
            longitude: lng,
            atualizadoEm: timestamp
          }).then(() => {
            statusEl.textContent = `Localização enviada: ${lat.toFixed(5)}, ${lng.toFixed(5)} — ${timestamp}`;
            console.log('Localização enviada Unidade A', lat, lng);
          }).catch(err => {
            statusEl.textContent = `❌ Erro ao enviar: ${err.message}`;
            console.error(err);
          });
        },
        (error) => {
          console.error("Erro GPS:", error);
          statusEl.textContent = `❌ Erro GPS: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 5000 }
      );
    } else {
      alert("Seu navegador não suporta geolocalização.");
      statusEl.textContent = "❌ GPS não suportado neste dispositivo.";
    }
  </script>
</body>
</html>
